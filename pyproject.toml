[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metastable"
version = "0.1.0"
description = "Stable Diffusion middleware: pipeline generators, device selection and checkpoint merging"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# torch is intentionally unpinned to a specific build: the consuming
# application picks the CPU / CUDA / ROCm wheel index.
dependencies = [
  "accelerate>=1.0",
  "diffusers>=0.42.1,<0.43",
  "numpy>=2.0",
  "peft>=0.19.1",
  "pillow>=12.0.0",
  "safetensors>=0.4.0",
  "scipy>=1.14",  # required by LMSDiscreteScheduler
  "torch>=2.15.0",
  "transformers>=5.22.2,<6",
]

[project.optional-dependencies]
telemetry = ["psutil>=6.0.0"]
quant = ["bitsandbytes>=0.49.2"]

[dependency-groups]
dev = [
  "psutil>=6.0.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/metastable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
